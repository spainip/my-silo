# These Fleet overrides configure the service endpoints. The full chart defaults
# and other supported settings are documented in charts/silo/values.yaml.
existingSecret: silo-root-credentials

ingress:
  hosts:
    - silo-api.spainip.es

consoleIngress:
  hosts:
    - silo.spainip.es

# Keep the Console's Prometheus queries on the cluster network. The scrape
# definition uses the job label configured below.
environment:
  MINIO_PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.cattle-monitoring-system.svc.cluster.local:9090
  MINIO_PROMETHEUS_JOB_ID: minio-job
